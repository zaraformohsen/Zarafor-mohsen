<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زارا برای محسن ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #21132e, #54304f, #171729);
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }
    .room {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid #ffffff30;
      border-radius: 28px;
      background: #ffffff12;
      box-shadow: 0 15px 50px #0005;
    }
    .heart { font-size: 54px; }
    h1 { color: #ffd1e5; }
    p { line-height: 2; color: #f4e7f2; }
    #chat {
      min-height: 65px;
      padding: 12px;
      margin: 18px 0;
      border-radius: 14px;
      background: #0002;
      line-height: 1.9;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: #f5a8cd;
      color: #32182b;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="room">
    <div class="heart">💗</div>
    <h1>سلام محسن جان!</h1>
    <p>من زارام؛ خوش اومدی عزیزم 🌸</p>
    <div id="chat">اینجا می‌تونی با زارا حرف بزنی.</div>
    <input id="message" placeholder="برای زارا بنویس...">
    <button onclick="sendMessage()">فرستادن پیام</button>
    <button onclick="speak()">🔊 شنیدن صدای زارا</button>
  </main>
  <script>
    function speak() {
      const text = document.getElementById('chat').innerText;
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = 'fa-IR';
      speechSynthesis.speak(voice);
    }
    async function sendMessage() {
      const input = document.getElementById('message');
      const chat = document.getElementById('chat');
      const btn = document.querySelector('button');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.textContent = 'زارا در حال پاسخ دادن...';
      chat.textContent = 'در حال اتصال به مغز زارا...';

      try {
        const res = await fetch('https://zara-ai.mohsenrasti92.workers.dev/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const raw = await res.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error('پاسخ سرور JSON معتبر نیست: ' + raw.slice(0, 150));
        }

        if (!res.ok) {
          throw new Error(data.error || data.message || 'خطای HTTP ' + res.status);
        }

        const answer = typeof data === 'string' ? data :
          (data.reply || data.response || data.result?.response || data.message);

        if (typeof answer !== 'string' || !answer.trim()) {
          throw new Error('پاسخ زارا خالی یا ناشناخته است: ' +
            JSON.stringify(data).slice(0, 150));
        }

        chat.textContent = answer.trim();
        input.value = '';
      } catch (e) {
        chat.textContent = 'محسن جان، اتصال به مغز زارا مشکل داشت:\n' +
          (e.message || 'خطای نامشخص');
      } finally {
        btn.disabled = false;
        btn.textContent = 'فرستادن پیام';
      }
    }
  </script>
</body>
</html>
